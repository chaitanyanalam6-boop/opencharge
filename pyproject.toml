[project]
name = "opencharge"
version = "0.1.0"
description = "Search real hospital prices from public CMS price transparency files."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
    "pytz>=2026.5",
    "ijson>=3.6.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "alembic>=1.20.0",
    "groq>=1.7.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencharge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly so tests do not depend on the editable-install .pth file.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: parses the real hospital files in data/raw/; skipped in CI",
    "llm: calls the real LLM (needs GROQ_API_KEY); skipped in CI",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
