# The 70 CMS-specified shoppable services (45 CFR 180.60; Table 3 of the Hospital Price
# Transparency final rule, 84 FR 65524).
#
# Transcribed from CMS, "10 Steps to Making Public Standard Charges for Shoppable Services",
# https://www.cms.gov/files/document/steps-making-public-standard-charges-shoppable-services.pdf
# (section "Final list of 70 CMS-specified shoppable services", 2020 primary codes).
#
# `codes` lists every code CMS accepts as the primary code for the service ("81000 or 81001",
# "84153-84154"). A hospital covers a service if it publishes a dollar rate for any of them.
# Used for the status page's coverage KPI.

source: https://www.cms.gov/files/document/steps-making-public-standard-charges-shoppable-services.pdf

